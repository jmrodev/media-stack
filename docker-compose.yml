name: media-stack

# Stack de medios auto-hospedado con acceso externo via subpaths.
# Reverse proxy: Caddy con Caddyfile estático (./caddy/Caddyfile).
# Acceso: http://<IP-O-DOMINIO>/{jellyfin,sonarr,radarr,bazarr,jellyseerr,wizarr,qbittorrent}
#
# Cada app necesita tener su "Base URL" / "UrlBase" seteada para que el subpath funcione.
# Después del primer boot corré `scripts/configure-base-urls.sh` para configurarlas
# y reiniciar las apps.
#
# ─── Paths ────────────────────────────────────────────────────────────────────
# Las rutas de host (./config, ./data) se configuran vía variables de entorno
# en un archivo `.env` al lado de este compose. Copiá `.env.example` como `.env`
# y editá los valores si querés mover las carpetas (ej. a /srv/media-stack).
# Defaults apuntan a ./config y ./data relativos al compose, igual que antes.
#
# ─── Data layout (TRaSH Guides) ────────────────────────────────────────────────
# La estructura interna sigue la convención de TRaSH Guides para que los *arr
# puedan usar hardlinks y moves atómicos entre /data/torrents y /data/media.
# Ver docs/DATA_LAYOUT.md o https://trash-guides.info/File-and-Folder-Structure/How-to-set-up/Docker/

services:
  # === Reverse proxy (Caddy con Caddyfile estático) ===
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile vive en el repo (./caddy/) — no se ignora por .gitignore,
      # así un clon fresco tiene el archivo disponible para el bind mount.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  # === Indexer manager (Prowlarr) ===
  # Reemplaza a Jackett. Se expone DIRECTO en :9696 del host.
  # Prowlarr sincroniza los indexers a Sonarr/Radarr como apps conectadas
  # (Settings > Apps en Prowlarr). FlareSolverr se configura en Prowlarr
  # (Settings > Indexer Proxies) con el tag "flaresolverr".
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    networks:
      - proxy

  # === FlareSolverr (resuelve challenges de Cloudflare para indexers) ===
  # Se expone directo en :8191 del host, sin pasar por Caddy.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    networks:
      - proxy

  # === TV shows ===
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      # TRaSH layout: Sonarr ve /data entero para que los hardlinks funcionen
      # y los moves desde /data/torrents a /data/media sean atómicos.
      - ${DATA_DIR:-./data}:/data
    networks:
      - proxy

  # === Movies ===
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${DATA_DIR:-./data}:/data
    networks:
      - proxy

  # === Subtitles ===
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - URL_BASE=/bazarr
    volumes:
      - ${CONFIG_DIR:-./config}/bazarr:/config
      # Bazarr solo necesita ver la biblioteca final.
      - ${DATA_DIR:-./data}/media:/data/media
    depends_on:
      - radarr
      - sonarr
    networks:
      - proxy
  # === Downloads ===
  # qBittorrent se expone DIRECTO en :8080 del host, sin pasar por Caddy.
  # No soporta subpath de forma estable (las URLs internas del HTML son relativas
  # y rompen cuando Caddy strippea el prefijo). Es la práctica estándar.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_DIR:-./config}/qbittorrent:/config
      # qBittorrent solo escribe en /data/torrents. Los *arr mueven los archivos
      # terminados a /data/media vía hardlink + delete del original.
      - ${DATA_DIR:-./data}/torrents:/data/torrents
      - ${DATA_DIR:-./data}/torrents:/data/downloads
      - ${DATA_DIR:-./data}/torrents:/downloads
    networks:
      - proxy

  # === Media server ===
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    volumes:
      - ${CONFIG_DIR:-./config}/jellyfin:/config
      # Jellyfin solo escanea la biblioteca final.
      - ${DATA_DIR:-./data}/media:/data/media
    networks:
      - proxy

  # === Request management ===
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - TZ=America/Argentina/Mendoza
      - LOG_LEVEL=info
    volumes:
      - ${CONFIG_DIR:-./config}/jellyseerr:/app/config
    networks:
      - proxy

  # === User invitation system ===
  # Imagen custom de pablokbs con APPLICATION_ROOT funcionando
  # (commits sobre wizarr upstream en junio 2026).
  wizarr:
    image: docker.io/pablokbs/wizarr
    container_name: wizarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - APPLICATION_ROOT=/wizarr
    volumes:
      - ${CONFIG_DIR:-./config}/wizarr:/config
    networks:
      - proxy

  # === DLNA (minidlna, host net para discovery SSDP en el TV) ===
  minidlna:
    image: vladgh/minidlna:latest
    container_name: minidlna
    restart: unless-stopped
    network_mode: host
    environment:
      - MINIDLNA_FRIENDLY_NAME=MediaStack
      - MINIDLNA_MEDIA_DIR_1=V,/data/media/movies
      - MINIDLNA_MEDIA_DIR_2=V,/data/media/series
      - MINIDLNA_MEDIA_DIR_3=A,/data/media/music
      - MINIDLNA_INOTIFY=yes
      - MINIDLNA_NOTIFY_INTERVAL=900
      - MINIDLNA_LOG_LEVEL=warn
      - MINIDLNA_ROOT_CONTAINER=B
      - MINIDLNA_STRICT_DLNA=no
    volumes:
      - ${DATA_DIR:-./data}/media:/data/media:ro

networks:
  proxy:
    name: proxy
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
